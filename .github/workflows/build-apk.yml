name: Gerar APK Android (GLPI HOSB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Debug (GLPI HOSB)
        run: gradle assembleDebug --no-daemon

      - name: Publicar APK como Artefato no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: GLPI-HOSB-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Criar/Atualizar Release com o APK para Download Direto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-latest
          name: "GLPI HOSB Android APK (Download Direto)"
          body: |
            ### 📱 Aplicativo Android GLPI HOSB (`glpi.hosb.com.br`)
            Baixe o arquivo **`app-debug.apk`** abaixo e instale diretamente no seu dispositivo Android.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
