name: Gerar APK Android (GLPI HOSB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gerar Keystore de Assinatura Release (V1 + V2 + V3)
        run: |
          keytool -genkeypair -v \
            -keystore app/release-keystore.jks \
            -alias glpi_hosb_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass glpihosb2026 \
            -keypass glpihosb2026 \
            -dname "CN=GLPI HOSB, OU=TIC, O=HOSB, L=Niteroi, ST=RJ, C=BR"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Release Assinado (GLPI HOSB)
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk GLPI-HOSB-v1.0.4.apk

      - name: Verificar Assinatura V1/V2/V3 do APK
        run: |
          jarsigner -verify -verbose -certs GLPI-HOSB-v1.0.4.apk | tail -n 20

      - name: Publicar APK como Artefato no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: GLPI-HOSB-Android-APK-v1.0.4
          path: GLPI-HOSB-v1.0.4.apk

      - name: Criar/Atualizar Release com o APK Assinado para Download Direto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "GLPI HOSB Android APK v1.0.4"
          body: |
            ### 📱 Aplicativo Android GLPI HOSB (`glpi.hosb.com.br`) — Versão 1.0.4
            - **Correção de Responsividade Mobile**: barra de paginação (`Exibindo 1 a 50...` + botões `◀ Anterior` e `Próxima ▶`), filtros e cabeçalhos com `Modifier.weight(1f)` e `softWrap = false`, impedindo quebra vertical de letras em qualquer tamanho de tela.
            - **Logo Oficial HOSB ("DESDE 1966")** com proporção nativa sem distorção (`drawable-nodpi` + ícones `mipmap`).
            - **Sincronização Dinâmica de Chamados ao Logar** e ao alternar perfis (`Perfil_TIC`, `Admin`, `Super-Admin`, `Supervisor`, `Perfil_Usuario_Padrao`).
            - **Assinatura completa V1 + V2 + V3**.

            👉 **Clique em `GLPI-HOSB-v1.0.4.apk` abaixo para baixar e instalar.**
          files: |
            GLPI-HOSB-v1.0.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
