name: Gerar APK Android (GLPI HOSB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verificar Keystore Permanente de Assinatura Release (V1 + V2 + V3)
        run: |
          if [ ! -f app/release-keystore.jks ]; then
            keytool -genkeypair -v \
              -keystore app/release-keystore.jks \
              -alias glpi_hosb_key \
              -keyalg RSA \
              -keysize 2048 \
              -startdate -3650d \
              -validity 15000 \
              -storepass glpihosb2026 \
              -keypass glpihosb2026 \
              -dname "CN=GLPI HOSB, OU=TIC, O=HOSB, L=Niteroi, ST=RJ, C=BR"
          fi
          keytool -list -v -keystore app/release-keystore.jks -storepass glpihosb2026 | head -n 20

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Release Assinado (GLPI HOSB)
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk GLPI-HOSB-v1.0.5.apk

      - name: Verificar Assinatura V1/V2/V3 do APK
        run: |
          jarsigner -verify -verbose -certs GLPI-HOSB-v1.0.5.apk | tail -n 20

      - name: Publicar APK como Artefato no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: GLPI-HOSB-Android-APK-v1.0.5
          path: GLPI-HOSB-v1.0.5.apk

      - name: Criar/Atualizar Release com o APK Assinado para Download Direto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: "GLPI HOSB Android APK v1.0.5"
          body: |
            ### 📱 Aplicativo Android GLPI HOSB (`glpi.hosb.com.br`) — Versão 1.0.5
            - **Resposta Direta aos Chamados (Acompanhamento, Solução e Tarefa)**: botão `💬 Responder Chamado` em cada card da lista e painel principal `💬 Responder & Conversa` logo ao abrir o chamado, integrado com `itilfollowup.form.php`, `itilsolution.form.php` e `tickettask.form.php` do servidor GLPI HOSB.
            - **Respostas Rápidas em 1 Toque** + opção **Privado (Somente TIC)** + carregamento em tempo real da descrição e histórico de conversas do chamado.
            - **Correção de Responsividade Mobile**: barra de paginação (`Exibindo 1 a 50...` + botões `◀ Anterior` e `Próxima ▶`) e filtros 100% responsivos sem quebra vertical.
            - **Assinatura completa V1 + V2 + V3**.

            👉 **Clique em `GLPI-HOSB-v1.0.5.apk` abaixo para baixar e instalar.**
          files: |
            GLPI-HOSB-v1.0.5.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
