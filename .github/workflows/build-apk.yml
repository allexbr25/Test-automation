name: Gerar APK Android (GLPI HOSB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gerar Keystore de Assinatura Release (V1 + V2 + V3)
        run: |
          keytool -genkeypair -v \
            -keystore app/release-keystore.jks \
            -alias glpi_hosb_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass glpihosb2026 \
            -keypass glpihosb2026 \
            -dname "CN=GLPI HOSB, OU=TIC, O=HOSB, L=Niteroi, ST=RJ, C=BR"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Release Assinado (GLPI HOSB)
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk GLPI-HOSB-v1.0.2.apk
          cp app/build/outputs/apk/release/app-release.apk GLPI-HOSB-v1.0.1.apk

      - name: Verificar Assinatura V1/V2/V3 do APK
        run: |
          jarsigner -verify -verbose -certs GLPI-HOSB-v1.0.2.apk | tail -n 20

      - name: Publicar APK como Artefato no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: GLPI-HOSB-Android-APK-v1.0.2
          path: GLPI-HOSB-v1.0.2.apk

      - name: Criar/Atualizar Release com o APK Assinado para Download Direto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "GLPI HOSB Android APK v1.0.2 (Perfis + Filtros + 331 Chamados + Logo HOSB)"
          body: |
            ### 📱 Aplicativo Android GLPI HOSB (`glpi.hosb.com.br`) — Versão 1.0.2
            - **Logo Oficial HOSB ("DESDE 1966")** integrada na Tela de Login, Barra Superior e Ícone do App.
            - **Seletor de Perfis no canto superior direito (`/Session/ChangeProfile`)**:
              - `Perfil_TIC` (127 chamados)
              - `Admin` (331 chamados)
              - `Super-Admin` (331 chamados)
              - `Supervisor` (127 chamados)
              - `Perfil_Usuario_Padrao` (127 chamados)
            - **Painel Completo de Filtros, Ordenação e Paginação** (Grupo Técnico, Categoria, Status ITIL, Ordenação e Linhas por página).
            - **Assinatura completa V1 + V2 + V3**.

            👉 **Clique em `GLPI-HOSB-v1.0.2.apk` abaixo para baixar e instalar.**
          files: |
            GLPI-HOSB-v1.0.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
