name: Gerar APK Android (GLPI HOSB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verificar Keystore Permanente de Assinatura Release (V1 + V2 + V3)
        run: |
          if [ ! -f app/release-keystore.jks ]; then
            keytool -genkeypair -v \
              -keystore app/release-keystore.jks \
              -alias glpi_hosb_key \
              -keyalg RSA \
              -keysize 2048 \
              -startdate -3650d \
              -validity 15000 \
              -storepass glpihosb2026 \
              -keypass glpihosb2026 \
              -dname "CN=GLPI HOSB, OU=TIC, O=HOSB, L=Niteroi, ST=RJ, C=BR"
          fi
          keytool -list -v -keystore app/release-keystore.jks -storepass glpihosb2026 | head -n 20

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Release Assinado (GLPI HOSB)
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk GLPI-HOSB-v1.0.6.apk

      - name: Verificar Assinatura V1/V2/V3 do APK
        run: |
          jarsigner -verify -verbose -certs GLPI-HOSB-v1.0.6.apk | tail -n 20

      - name: Publicar APK como Artefato no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: GLPI-HOSB-Android-APK-v1.0.6
          path: GLPI-HOSB-v1.0.6.apk

      - name: Criar/Atualizar Release com o APK Assinado para Download Direto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: "GLPI HOSB Android APK v1.0.6"
          body: |
            ### 📱 Aplicativo Android GLPI HOSB (`glpi.hosb.com.br`) — Versão 1.0.6 (Otimizada para Samsung Galaxy S23 Ultra • One UI 9)
            - **Barra de Pesquisa Compacta em Pílula (One UI 9 — 40dp)**: substitui a caixa retangular alta por uma pílula enxuta (`RoundedCornerShape(20.dp)`) com botão compacto de `Filtros`, liberando amplo espaço vertical para a lista de chamados.
            - **Tela de Login Limpa**: removidos textos técnicos (`TLS 1.3`, `Android Keystore AES-256-GCM`) mantendo toda a segurança e criptografia ativas de forma transparente em segundo plano.
            - **Responsividade para Samsung Galaxy S23 Ultra (One UI 9)**: suporte nativo a `.systemBarsPadding()` (recorte da câmera frontal e barra de gestos) e `.imePadding()` (teclado nunca cobre o botão `Enviar Resposta`).
            - **Keystore Permanente V1 + V2 + V3**: permite instalar ou atualizar sobre versões anteriores sem conflito de assinatura.

            👉 **Clique em `GLPI-HOSB-v1.0.6.apk` abaixo para baixar e instalar.**
          files: |
            GLPI-HOSB-v1.0.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
