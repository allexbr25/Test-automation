name: Gerar APK Android (GLPI HOSB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verificar Keystore Permanente de Assinatura Release (V1 + V2 + V3)
        run: |
          if [ ! -f app/release-keystore.jks ]; then
            keytool -genkeypair -v \
              -keystore app/release-keystore.jks \
              -alias glpi_hosb_key \
              -keyalg RSA \
              -keysize 2048 \
              -startdate -3650d \
              -validity 15000 \
              -storepass glpihosb2026 \
              -keypass glpihosb2026 \
              -dname "CN=GLPI HOSB, OU=TIC, O=HOSB, L=Niteroi, ST=RJ, C=BR"
          fi
          keytool -list -v -keystore app/release-keystore.jks -storepass glpihosb2026 | head -n 20

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Release Assinado (GLPI HOSB)
        run: |
          set +e
          gradle assembleRelease --no-daemon > build.log 2>&1
          EXIT_CODE=$?
          cat build.log
          if [ $EXIT_CODE -ne 0 ]; then
            ERR_SUMMARY=$(grep -A 6 -E "e: |What went wrong:" build.log | head -n 40 | tr '\n' ' ')
            echo "::error title=Gradle Build Error::$ERR_SUMMARY"
            exit $EXIT_CODE
          fi
          cp app/build/outputs/apk/release/app-release.apk GLPI-HOSB-v1.0.8.apk

      - name: Verificar Assinatura V1/V2/V3 do APK
        run: |
          jarsigner -verify -verbose -certs GLPI-HOSB-v1.0.8.apk | tail -n 20

      - name: Publicar APK como Artefato no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: GLPI-HOSB-Android-APK-v1.0.8
          path: GLPI-HOSB-v1.0.8.apk

      - name: Criar/Atualizar Release com o APK Assinado para Download Direto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: "GLPI HOSB Android APK v1.0.8"
          body: |
            ### 📱 Aplicativo Android GLPI HOSB (`glpi.hosb.com.br`) — Versão 1.0.8 (Otimizada para Samsung Galaxy S23 Ultra • One UI 9)
            - **Sessão persistente**: sair/fechar o app não faz mais logout (igual WhatsApp/Telegram). O logout só ocorre em `Sair da Sessão`.
            - **Notificações com o app fechado**: sincronização em segundo plano (WorkManager) que continua avisando sobre novos chamados e movimentações, inclusive após reiniciar o celular.
            - **Bloqueio por biometria ao retornar**: ao voltar para o app, ele pede digital/rosto/PIN antes de mostrar os chamados (igual ao Telegram).
            - **Login por Biometria (`Entrar com Biometria`)**: integração nativa com o leitor ultrassônico de impressão digital e reconhecimento facial do Samsung Galaxy S23 Ultra via `BiometricPrompt`.
            - **Notificações de Novos Chamados e Movimentações**: alertas nativos do Android (`IMPORTANCE_HIGH`) + sino de notificações (`🔔`) na barra superior com contador de não lidas e histórico em tempo real.
            - **Barra de Ações Completa no Chamado (idêntica ao GLPI Web)**:
              - **💬 Responder**: acompanhamento com modelos rápidos, origem da requisição (`Helpdesk`, `Telefone`, `E-mail`, `Direta`, `Escrita`), `Privado`, `Pendente` e botão `+ Adicionar`.
              - **☑️ Tarefa**: modelos de tarefa, categoria, status (`Para fazer`, `Feito`, `Informação`), duração (`15` a `120 min`), botão `📅 Planejar esta tarefa`, `Privado`, `Pendente` e botão `+ Adicionar`.
              - **✓ Solução**: modelos de solução, tipo de solução, gravação na Base de Conhecimento (`KB`) e botão `+ Adicionar` que soluciona o chamado.
              - **📄 Documento**: rubrica do documento, seleção de arquivo (`📎 Escolher Arquivo (Foto / PDF)`) ou `📸 Captura de tela`, título, comentário e botão `+ Adicionar novo arquivo`.
              - **👍 Aprovação**: envio de solicitação de aprovação (`Etapa de aprovação`, `Usuário` ou `Grupo`, aprovador, comentários e `+ Adicionar`) + decisão direta nos pedidos pendentes (`✅ Aprovar` / `❌ Recusar`).

            👉 **Clique em `GLPI-HOSB-v1.0.8.apk` abaixo para baixar e instalar.**
          files: |
            GLPI-HOSB-v1.0.8.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
